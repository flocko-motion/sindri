name: release

# Build and publish release assets whenever a semver tag (vMAJOR.MINOR.PATCH) is
# pushed — e.g. by `make release <major|minor|patch>`. Ships one artifact shape for
# every platform: a tarball (linux + darwin, arm64 + amd64) that install.sh unpacks
# into ~/.local/bin. All cross-compiled on the Linux runner (pure Go, no cgo).
#
# There is deliberately NO .deb. A system package lands in /usr/bin, which then
# shadows or is shadowed by the ~/.local/bin install depending on PATH order, and
# the two drift apart silently. One install location means one build in play.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # create the GitHub release and upload the assets

# Versions of the bundled tools. Bump alongside the image.
env:
  TD_VERSION: v0.45.0
  YQ_VERSION: v4.53.3

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Build releases with the LATEST stable Go, not go.mod's minimum pin —
          # otherwise every released binary is frozen at that old Go, and its
          # go/packages (brokkr's deadcode) skews against a newer `go list` on the
          # target machine ("uses go1.25 … runs go1.26 of go list"). `stable` tracks
          # the newest release automatically, matching ci.yml.
          go-version: stable

      - name: Stage bundled tools (td, yq) onto PATH
        run: |
          go install "github.com/marcus/td@${TD_VERSION}"
          go install "github.com/mikefarah/yq/v4@${YQ_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build tarballs (linux + darwin, arm64 + amd64)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          gopath="$(go env GOPATH)"
          # brokkr reports this as its build time. Go's build info carries the COMMIT
          # time and never the build's own, so an unstamped release binary would tell
          # the user "not stamped" — stamp it here exactly as the Makefile does.
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for os in linux darwin; do
          for arch in arm64 amd64; do
            stage="dist/sindri_${ver}_${os}_${arch}"
            mkdir -p "$stage"
            # Host binaries (CLI/TUI/hub + the lint toolbelt).
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "-X main.version=${ver}" -o "$stage/sindri" ./cmd/sindri/
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags "-X main.version=${ver} -X main.buildTime=${built}" -o "$stage/brokkr" ./cmd/brokkr/
            # The browser and brokkr-linux run INSIDE the (always linux) pod, so they are
            # linux builds arch-matched to the host's VM — on linux, the same as above.
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -o "$stage/sindri-worker" ./cmd/sindri-worker/
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -ldflags "-X main.version=${ver} -X main.buildTime=${built}" -o "$stage/brokkr-linux" ./cmd/brokkr/
            # Bundled tools: td cross-compiled (its cross output lands in
            # $GOPATH/bin/<os>_<arch>/, but the native pair lands in bin/), yq from its
            # official release for that platform.
            GOOS="$os" GOARCH="$arch" go install "github.com/marcus/td@${TD_VERSION}"
            if [ -f "${gopath}/bin/${os}_${arch}/td" ]; then
              cp "${gopath}/bin/${os}_${arch}/td" "$stage/td"
            else
              cp "${gopath}/bin/td" "$stage/td"   # native build target
            fi
            curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${os}_${arch}" -o "$stage/yq"
            chmod +x "$stage/yq"
            # install.sh handles first-install AND in-place upgrades (atomic replace of a
            # running binary, Gatekeeper quarantine) — the tarball's upgrade path.
            cp scripts/install.sh "$stage/install.sh"
            chmod +x "$stage/install.sh"
            cp LICENSE THIRD_PARTY_LICENSES.md "$stage/"
            tar -C dist -czf "dist/sindri_${ver}_${os}_${arch}.tar.gz" "sindri_${ver}_${os}_${arch}"
          done
          done
          ls -la dist/*.tar.gz

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sindri_*.tar.gz
          generate_release_notes: true
